<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Tic Tac Toe Logo
    - Monochrome, inherits color via currentColor
    - Works on light/dark backgrounds
    - Grid with one X and one O
  -->
  <defs>
    <mask id="round-corners">
      <rect x="0" y="0" width="256" height="256" rx="28" ry="28" fill="white"/>
    </mask>
  </defs>

  <!-- Background shape (transparent by default; add fill via CSS if desired) -->
  <rect x="0" y="0" width="256" height="256" rx="28" ry="28" fill="transparent" />

  <g mask="url(#round-corners)" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid lines -->
    <line x1="85.33" y1="12" x2="85.33" y2="244"/>
    <line x1="170.66" y1="12" x2="170.66" y2="244"/>
    <line x1="12" y1="85.33" x2="244" y2="85.33"/>
    <line x1="12" y1="170.66" x2="244" y2="170.66"/>

    <!-- X (top-left cell) -->
    <line x1="28" y1="28" x2="77" y2="77"/>
    <line x1="77" y1="28" x2="28" y2="77"/>

    <!-- O (center cell) -->
    <circle cx="128" cy="128" r="28" />

    <!-- X (bottom-right cell) -->
    <line x1="179" y1="179" x2="228" y2="228"/>
    <line x1="228" y1="179" x2="179" y2="228"/>
  </g>
</svg>
